name: Release Socks UI

on:
  push:
    branches:
      - 'feature/flower-build-lib'
    tags:
      - 'v*'
env:
  RELEASE_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '0.2.3-test' }}

jobs:
  release:
    name: Build ${{ matrix.platform }} JAR
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            java-architecture: x64
          - os: ubuntu-latest
            platform: linux-x64
            java-architecture: x64
          - os: macos-15
            platform: macos-arm64
            java-architecture: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.java-architecture }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build and verify platform JAR
        run: >-
          gradle :SocksUi:verifyPlatformJar
          --project-prop "releaseVersion=${{ env.RELEASE_VERSION }}"
          --project-prop "releasePlatform=${{ matrix.platform }}"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocksUi-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}
          path: SocksUi/build/libs/*-${{ matrix.platform }}.jar
          if-no-files-found: error

      - name: Upload JAR to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: SocksUi/build/libs/*-${{ matrix.platform }}.jar
          fail_on_unmatched_files: true
