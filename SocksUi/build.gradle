import java.util.zip.ZipFile

plugins {
    id 'application'
    id 'com.flower.java-base'
    id 'com.flower.errorprone'
    id 'com.flower.javafx'
    id 'com.flower.jpackage'
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group 'com.flower.socksui'
version = providers.gradleProperty('releaseVersion')
        .orElse('0.2.3')
        .map { it.replaceFirst(/^v/, '') }
        .get()

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.8.1'
}

application {
    mainModule = 'com.flower.net.socksui'
    mainClass = 'com.flower.net.socksui.SocksUiLauncher'
}

def jpackageVersion = version.toString().replaceFirst(/-.*/, '')
def projectName = "SocksUi"

runtime {
    jpackage {
        imageName = projectName
        installerName = projectName
        appVersion = jpackageVersion
    }
}

dependencies {
    implementation project(':CryptCore')
    implementation project(':JavaFxUtils')
    implementation project(':KeyManagerFx')
    implementation project(':NetConfig')
    implementation project(':NetCore')
    implementation project(':SocksChainServer')

    annotationProcessor "org.immutables:value:2.9.2"

    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.13.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.0'
    implementation 'com.google.guava:guava:31.1-jre'
    implementation "org.immutables:value-annotations:2.9.2" // or implementation, or compileOnly

    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.20.0'

    implementation 'io.netty:netty-all:4.1.119.Final' // Use the latest version

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'com.google.guava:guava-testlib:31.1-jre'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-guava:2.13.4'
    implementation 'org.apache.commons:commons-lang3:3.13.0'
    implementation 'org.jfxtras:jfxtras-controls:17-r1'

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

// build jar:
// ./gradlew jar -Dorg.gradle.java.home=/Users/john/Library/Java/JavaVirtualMachines/temurin-17.0.5/Contents/Home
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.flower.net.socksui.SocksUiLauncher'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

flowerErrorProne {
    annotatedPackages = ['com.flower.net.socksui']
}

def releasePlatform = providers.gradleProperty('releasePlatform')

tasks.named('shadowJar') {
    archiveClassifier.set(releasePlatform.orElse('all'))
}

tasks.register('verifyPlatformJar') {
    dependsOn tasks.named('shadowJar')

    doLast {
        def platform = releasePlatform.orNull
        def nativeMarkers = [
                'windows-x64': 'glass.dll',
                'linux-x64'  : 'libglass.so',
                'macos-arm64': 'libglass.dylib'
        ]
        def expectedMarker = nativeMarkers[platform]

        if (expectedMarker == null) {
            throw new GradleException(
                    "Set -PreleasePlatform to one of: ${nativeMarkers.keySet().join(', ')}"
            )
        }

        def jarFile = tasks.named('shadowJar').get().archiveFile.get().asFile
        def entries = [] as Set
        new ZipFile(jarFile).withCloseable { archive ->
            archive.entries().each { entry ->
                entries.add(entry.name.tokenize('/').last())
            }
        }
        def includedMarkers = nativeMarkers.values().findAll { entries.contains(it) }

        if (includedMarkers != [expectedMarker]) {
            throw new GradleException(
                    "${jarFile.name} must contain only ${expectedMarker}, found: ${includedMarkers}"
            )
        }
    }
}
