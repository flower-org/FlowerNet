name: Release Packet UI

# This triggers workflow on tag push
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Allow write access to repository contents

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Set up JDK 17 with Temurin
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.14

      - name: Do wrapper
        run: gradle wrapper

      - name: Build JAR file with Gradle
        run: ./gradlew :PacketUi:shadowJar

      - name: ls
        run: ls -al PacketUi/build/libs

      - name: sha256
        run: openssl sha256 PacketUi/build/libs/*

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            PacketUi/build/libs/PacketUi-${{ github.ref_name }}-amd64-all.jar
            PacketUi/DNS-SETUP.md
            PacketUi/nf-iptables.sh
