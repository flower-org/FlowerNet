name: Release Socks UI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }} JAR
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            java-architecture: x64
          - os: ubuntu-latest
            platform: linux-x64
            java-architecture: x64
          - os: macos-15
            platform: macos-arm64
            java-architecture: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.java-architecture }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build and verify platform JAR
        run: >-
          gradle :SocksUi:verifyPlatformJar
          --project-prop "releaseVersion=${{ env.RELEASE_VERSION }}"
          --project-prop "releasePlatform=${{ matrix.platform }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocksUi-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}
          path: SocksUi/build/libs/*-${{ matrix.platform }}.jar
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SocksUi-${{ env.RELEASE_VERSION }}-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload JAR to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.jar
          fail_on_unmatched_files: true
